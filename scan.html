<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JIVAC Patrol Fast-Clock</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(160deg, #062B63 0%, #0a1f4e 100%);
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff; border-radius: 24px; padding: 40px 32px 36px;
      width: 100%; max-width: 360px; text-align: center;
      box-shadow: 0 32px 80px rgba(0,0,0,0.4);
    }
    .card-header {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      padding-bottom: 20px; margin-bottom: 28px; border-bottom: 3px solid #C9A24A;
    }
    .brand-name { font-size: 16px; font-weight: 800; color: #062B63; letter-spacing: 1px; }
    .state { display: none; }
    .state.active { display: block; }
    .ready-icon {
      width: 80px; height: 80px; border-radius: 50%; background: #eff6ff;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
    }
    .ready-icon svg { width: 38px; height: 38px; stroke: #1E90FF; fill: none; stroke-width: 2.5; }
    .code-display { font-size: 18px; font-weight: 800; color: #062B63; margin-bottom: 24px; word-break: break-all; }
    .clock-btn {
      width: 100%; padding: 16px; background: #062B63; color: #C9A24A;
      border: none; border-radius: 14px; font-size: 18px; font-weight: 900;
      cursor: pointer; box-shadow: 0 8px 24px rgba(6,43,99,0.25);
    }
    .clock-btn:disabled { background: #d1d9f0; color: #888; cursor: not-allowed; }
    .icon-circle {
      width: 88px; height: 88px; border-radius: 50%; background: #dcfce7;
      display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
    }
    .icon-circle svg { width: 40px; height: 40px; stroke: #16a34a; fill: none; stroke-width: 3; }
    .state-title { font-size: 24px; font-weight: 900; color: #062B63; margin-bottom: 6px; }
    .state-sub { font-size: 14px; color: #666; }
  </style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="brand-name">JIVAC GROUP PATROL</div>
  </div>

  <div id="s-ready" class="state active">
    <div class="ready-icon">
      <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
    </div>
    <div style="font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 4px;">Scanned Checkpoint</div>
    <div class="code-display" id="code-text">Reading code...</div>
    <button class="clock-btn" id="clock-btn" onclick="sendToControlRoom()">CLOCK IN</button>
  </div>

  <div id="s-success" class="state">
    <div class="icon-circle">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="state-title">Sent to Control!</div>
    <div class="state-sub">Patrol round successfully recorded.</div>
  </div>

  <div id="s-error" class="state">
    <div class="icon-circle" style="background:#fee2e2;"><svg viewBox="0 0 24 24" style="stroke:#dc2626;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
    <div class="state-title">No Code Found</div>
    <div class="state-sub">Please scan a valid JIVAC QR code link.</div>
  </div>
</div>

<script>
  const SUPA_URL = 'https://mwqpdttawfnrugibjbbm.supabase.co';
  const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im13cXBkdHRhd2ZucnVnaWJqYmJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0NDAyMjEsImV4cCI6MjA5NjcxNjIyMX0.9CpFiqucvcBbkw2QrtrGwS4X4m1TXY2z4gs6HxYUtJc';

  const urlParams = new URLSearchParams(window.location.search);
  const scannedCode = urlParams.get('qr') || urlParams.get('code');

  if (!scannedCode) {
    document.getElementById('s-ready').style.display = 'none';
    document.getElementById('s-error').style.display = 'block';
  } else {
    document.getElementById('code-text').textContent = scannedCode;
  }

  async function sendToControlRoom() {
    const btn = document.getElementById('clock-btn');
    btn.disabled = true;
    btn.textContent = "Sending...";

    const now = new Date();
    
    try {
      const response = await fetch(`${SUPA_URL}/rest/v1/patrol_rounds`, {
        method: 'POST',
        headers: {
          'apikey': SUPA_KEY,
          'Authorization': `Bearer ${SUPA_KEY}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          status: 'completed',
          completed_at: now.toISOString(),
          round_date: now.toISOString().split('T')[0],
          hour_window: now.getHours(),
          notes: `Scanned QR: ${scannedCode}`
        })
      });

      if (!response.ok) throw new Error('Failed to post data');

      document.getElementById('s-ready').style.display = 'none';
      document.getElementById('s-success').style.display = 'block';

    } catch (error) {
      console.error(error);
      btn.disabled = false;
      btn.textContent = "CLOCK IN";
      alert('Failed to send data. Please check your internet connection.');
    }
  }
</script>
</body>
</html>
