  <title>JIVAC Admin, Locations & QR Codes</title>
  <script>
    window.JIVAC_CONFIG = {
      SUPABASE_URL:'https://mwqpdttawfnrugibjbbm.supabase.co',

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --navy:#062B63; --blue:#1565C0; --sky:#1E90FF; --gold:#C9A24A;
      --black:#111111; --green:#2FA84F; --red:#E52424;
      --bg:#f0f4ff; --border:#e0e7ff;
    }
    body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--black); min-height:100vh; }
    header { background:var(--navy); border-bottom:3px solid var(--gold); height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 32px; position:sticky; top:0; z-index:200; box-shadow:0 2px 20px rgba(6,43,99,0.3); }
    .hd-left { display:flex; align-items:center; gap:12px; }
    .logo-box { width:40px; height:40px; background:var(--gold); border-radius:7px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:15px; color:var(--black); }
    .hd-title h1 { font-size:16px; font-weight:800; letter-spacing:1.5px; color:#fff; }
    .hd-title p  { font-size:9px; color:var(--gold); letter-spacing:2.5px; text-transform:uppercase; margin-top:1px; }
    .nav-links { display:flex; gap:8px; }
    .nav-link { padding:7px 16px; border-radius:7px; font-size:12px; font-weight:600; text-decoration:none; color:rgba(255,255,255,0.6); border:1px solid transparent; transition:all 0.2s; }
    .nav-link:hover { color:#fff; border-color:rgba(255,255,255,0.3); }
    .nav-link.active { background:rgba(255,255,255,0.15); color:#fff; border-color:rgba(255,255,255,0.2); }
    .page { display:grid; grid-template-columns:380px 1fr; min-height:calc(100vh - 64px); }
    .left-panel { background:#fff; border-right:1px solid var(--border); padding:28px 24px; overflow-y:auto; }
    .panel-title { font-size:11px; text-transform:uppercase; letter-spacing:2px; color:#999; margin-bottom:16px; }
    .add-form { background:#f8faff; border:1.5px solid var(--border); border-radius:12px; padding:20px; margin-bottom:24px; }
    .add-form h3 { font-size:14px; font-weight:700; margin-bottom:16px; color:var(--navy); }
    .field { margin-bottom:14px; }
    .field label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#666; margin-bottom:6px; }
    .field input { width:100%; background:#fff; border:1.5px solid #d1d9f0; border-radius:8px; padding:9px 13px; font-size:13px; color:#111; outline:none; transition:border-color 0.2s; }
    .field input:focus { border-color:var(--sky); box-shadow:0 0 0 3px rgba(30,144,255,0.1); }
    .points-builder { margin-bottom:14px; }
    .points-builder label { display:block; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#666; margin-bottom:8px; }
    .point-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .point-num { width:26px; height:26px; background:var(--navy); border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:var(--gold); flex-shrink:0; }
    .point-input { flex:1; background:#fff; border:1.5px solid #d1d9f0; border-radius:7px; padding:8px 12px; font-size:13px; color:#111; outline:none; transition:border-color 0.2s; }
    .point-input:focus { border-color:var(--sky); }
    .del-point { width:28px; height:28px; background:#fff0f0; border:1px solid #fca5a5; border-radius:6px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--red); font-size:16px; flex-shrink:0; }
    .del-point:hover { background:#fee2e2; }
    .add-point-btn { width:100%; padding:8px; background:#f0f4ff; border:1.5px dashed #93b4ff; border-radius:8px; color:var(--blue); font-size:12px; font-weight:600; cursor:pointer; margin-top:4px; }
    .add-point-btn:hover { background:#dbeafe; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:10px 20px; border-radius:8px; border:none; font-size:13px; font-weight:700; cursor:pointer; transition:all 0.2s; width:100%; }
    .btn-gold { background:var(--gold); color:var(--black); box-shadow:0 4px 12px rgba(201,162,74,0.3); }
    .btn-gold:hover { transform:translateY(-1px); }
    .btn-ghost { background:#fff; color:#555; border:1.5px solid #d1d9f0; width:auto; padding:7px 14px; font-size:11px; }
    .btn-ghost:hover { border-color:var(--sky); color:var(--sky); }
    .btn-danger { background:#fff0f0; color:var(--red); border:1px solid #fca5a5; width:auto; padding:7px 14px; font-size:11px; }
    .btn-danger:hover { background:#fee2e2; }
    .btn-download { background:var(--navy); color:#fff; border:none; width:auto; padding:7px 16px; font-size:11px; border-radius:7px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
    .btn-download:hover { opacity:0.85; }
    .loc-list { display:flex; flex-direction:column; gap:10px; }
    .loc-item { background:#fff; border:1.5px solid var(--border); border-radius:10px; padding:14px 16px; cursor:pointer; transition:all 0.2s; }
    .loc-item:hover { border-color:var(--sky); }
    .loc-item.selected { border-color:var(--sky); background:#f0f8ff; }
    .loc-item.inactive { opacity:0.5; }
    .loc-item-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
    .loc-name { font-size:14px; font-weight:700; color:var(--navy); }
    .active-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .active-dot.on { background:var(--green); }
    .active-dot.off { background:#ccc; }
    .loc-meta { font-size:11px; color:#888; }
    .loc-actions { display:flex; gap:6px; margin-top:10px; }
    .right-panel { padding:32px; overflow-y:auto; background:#f8faff; }
    .empty-right { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#ccc; text-align:center; gap:12px; }
    .empty-right p { font-size:14px; }
    .loc-detail-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:28px; gap:16px; }
    .loc-detail-header h2 { font-size:22px; font-weight:800; color:var(--navy); }
    .loc-detail-header .address { font-size:13px; color:#888; margin-top:4px; }
    .detail-actions { display:flex; gap:8px; flex-shrink:0; }
    .section-label { font-size:11px; text-transform:uppercase; letter-spacing:2px; color:#999; margin-bottom:14px; padding-bottom:8px; border-bottom:1.5px solid var(--border); }
    .qr-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:16px; margin-bottom:24px; }
    .qr-card-screen { background:#fff; border:1.5px solid var(--border); border-radius:12px; padding:16px; text-align:center; box-shadow:0 2px 8px rgba(6,43,99,0.06); }
    .qr-canvas-wrap { background:#fff; border-radius:8px; padding:10px; display:inline-block; margin-bottom:10px; border:1px solid #e5e7eb; }
    .qr-point-name { font-size:13px; font-weight:700; color:var(--navy); margin-bottom:4px; }
    .qr-code-id { font-size:10px; color:#aaa; font-family:monospace; margin-bottom:8px; }
    @media print {
      header,.left-panel,.loc-detail-header,.section-label,.detail-actions,.btn,.nav-links,.download-bar { display:none !important; }
      body { background:#fff; }
      .page { display:block; }
      .right-panel { padding:10px; background:#fff; }
      .qr-grid { grid-template-columns:repeat(3,1fr); gap:12px; }
      .qr-card-screen { display:none; }
      .print-cards { display:block !important; }
    }
    .print-cards { display:none; }
    .print-card { background:#fff; border:2px solid #C9A24A; border-radius:10px; padding:18px; text-align:center; page-break-inside:avoid; }
    .print-card-header { display:flex; align-items:center; justify-content:center; gap:8px; border-bottom:2px solid #C9A24A; padding-bottom:10px; margin-bottom:12px; }
    .print-mini-logo { width:30px; height:30px; background:#111; border-radius:5px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:11px; color:#C9A24A; }
    .print-brand { font-size:12px; font-weight:800; color:#111; letter-spacing:1px; }
    .print-card .print-point { font-size:16px; font-weight:800; color:#062B63; margin-bottom:2px; }
    .print-card .print-loc   { font-size:12px; color:#888; margin-bottom:8px; }
    .print-card .print-code  { font-size:10px; font-family:monospace; background:#f5f5f5; padding:3px 8px; border-radius:4px; color:#aaa; display:inline-block; }
    .print-card .print-instr { font-size:11px; color:#bbb; margin-top:8px; }
    .download-bar { display:flex; align-items:center; justify-content:space-between; background:#fff; border:1.5px solid var(--border); border-radius:10px; padding:12px 16px; margin-bottom:20px; }
    .download-bar span { font-size:13px; color:#555; font-weight:600; }
    .download-bar-btns { display:flex; gap:8px; }
    #toast { position:fixed; bottom:32px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--navy); color:#fff; padding:12px 24px; border-radius:10px; font-size:13px; font-weight:600; opacity:0; transition:all 0.3s; z-index:999; pointer-events:none; border:1px solid rgba(255,255,255,0.2); }
    #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
    #toast.success { border-color:rgba(47,168,79,0.5); color:#4ade80; }
    #toast.error   { border-color:rgba(229,36,36,0.4); color:#f87171; }
    .spin { width:16px; height:16px; border:2px solid rgba(255,255,255,0.2); border-top-color:currentColor; border-radius:50%; animation:spinning 0.7s linear infinite; display:inline-block; }
    @keyframes spinning { to { transform:rotate(360deg); } }
    @media (max-width:900px) { .page { grid-template-columns:1fr; } .left-panel { border-right:none; border-bottom:1px solid var(--border); } }
  </style>
</head>
<body>
<header>
  <div class="hd-left">
    <div class="logo-box">JG</div>
    <div class="hd-title">
      <h1>JIVAC GROUP</h1>
      <p>Patrol System · Admin</p>
    </div>
  </div>
  <div class="nav-links">
    <a href="index.html"        class="nav-link">Home</a>
    <a href="admin.html"        class="nav-link active">Admin</a>
    <a href="qrcodes.html"      class="nav-link">QR Codes</a>
    <a href="control-room.html" class="nav-link">Control Room</a>
  </div>
</header>

<div class="page">
  <div class="left-panel">
    <div class="add-form">
      <h3>Add New Location</h3>
      <div class="field">
        <label>Company / Location Name</label>
        <input type="text" id="inp-loc-name" placeholder="e.g. Access Bank Lekki Branch" />
      </div>
      <div class="field">
        <label>Address <span style="color:#bbb">(optional)</span></label>
        <input type="text" id="inp-loc-address" placeholder="e.g. 15 Admiralty Way, Lekki" />
      </div>
      <div class="points-builder">
        <label>Patrol / Clocking Points</label>
        <div id="points-list"></div>
        <button class="add-point-btn" onclick="addPointRow()">+ Add Another Point</button>
      </div>
      <button class="btn btn-gold" id="save-btn" onclick="saveLocation()">
        Save Location & Generate QR Codes
      </button>
    </div>
    <div class="panel-title">Your Locations</div>
    <div class="loc-list" id="loc-list">
      <div style="text-align:center;padding:30px;color:#bbb;font-size:13px;">
        <div style="width:20px;height:20px;border:2px solid #e0e7ff;border-top-color:#1E90FF;border-radius:50%;animation:spinning 0.8s linear infinite;margin:0 auto 10px;"></div>
        Loading...
      </div>
    </div>
  </div>

  <div class="right-panel" id="right-panel">
    <div class="empty-right">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="1.5">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="3" height="3"/>
        <rect x="19" y="14" width="2" height="2"/><rect x="14" y="19" width="2" height="2"/>
        <rect x="18" y="18" width="3" height="3"/>
      </svg>
      <p>Select a location to view and download its QR codes</p>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
  const SUPA_URL  = window.JIVAC_CONFIG.SUPABASE_URL;
  const SUPA_KEY  = window.JIVAC_CONFIG.SUPABASE_ANON_KEY;
  const SCAN_BASE = window.JIVAC_CONFIG.SCAN_BASE_URL;
  let selectedLocId = null;

  async function api(method, path, body) {
    // Sanitizes endpoint requests to prevent harmful double-slash formatting issues
    const cleanPath = path.startsWith('/') ? path.slice(1) : path;
    const targetUrl = `${SUPA_URL}/rest/v1/${cleanPath}`;

    const r = await fetch(targetUrl, {
      method,
      headers: {
        'apikey': SUPA_KEY, 
        'Authorization': `Bearer ${SUPA_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': method === 'POST' ? 'return=representation' : ''
      },
      body: body ? JSON.stringify(body) : undefined
    });
    
    if (r.status === 204) return true;
    if (!r.ok) { 
      const txt = await r.text();
      console.error('API execution error:', r.status, txt); 
      return null; 
    }
    return r.json().catch(() => null);
  }

  function toast(msg, type='success') {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = `show ${type}`;
    setTimeout(() => { t.className = ''; }, 3500);
  }

  let pointCount = 0;

  function addPointRow(value='') {
    pointCount++;
    const div = document.createElement('div');
    div.className = 'point-row'; div.id = `pr-${pointCount}`;
    div.innerHTML = `
      <div class="point-num">${pointCount}</div>
      <input class="point-input" type="text" placeholder="e.g. Main Gate" value="${value}" />
      <div class="del-point" onclick="removePoint('pr-${pointCount}')">×</div>`;
    document.getElementById('points-list').appendChild(div);
    if (!value) div.querySelector('input').focus();
  }

  function removePoint(id) {
    const el = document.getElementById(id); if (el) el.remove();
    document.querySelectorAll('.point-row').forEach((row, i) => {
      row.querySelector('.point-num').textContent = i + 1;
    });
  }

  function getPointNames() {
    return Array.from(document.querySelectorAll('.point-input')).map(i => i.value.trim()).filter(Boolean);
  }

  function slugify(str) {
    return str.toUpperCase().replace(/[^A-Z0-9]/g, '-').replace(/-+/g, '-').substring(0, 10);
  }

  function makeQrCode(locName, pointName, index) {
    const l = slugify(locName).substring(0, 6);
    const p = slugify(pointName).substring(0, 6);
    const n = String(index).padStart(3, '0');
    const rand = Math.random().toString(36).substring(2, 6).toUpperCase();
    return `${l}-${p}-${n}-${rand}`;
  }

  async function saveLocation() {
    const name    = document.getElementById('inp-loc-name').value.trim();
    const address = document.getElementById('inp-loc-address').value.trim();
    const points  = getPointNames();

    if (!name) { toast('Please enter a company / location name', 'error'); document.getElementById('inp-loc-name').focus(); return; }
    if (points.length === 0) { toast('Please add at least one patrol point', 'error'); return; }

    const btn = document.getElementById('save-btn');
    btn.innerHTML = '<span class="spin"></span> Saving...'; btn.disabled = true;

    try {
      const locs = await api('POST', 'locations', { name, address: address || null, total_points: points.length, is_active: true });
      if (!locs) throw new Error('Failed to save location — check Supabase RLS policies');
      const loc = Array.isArray(locs) ? locs[0] : locs;
      if (!loc || !loc.id) throw new Error('No location ID returned from database');

      const pointRows = points.map((pName, i) => ({
        location_id: loc.id, point_name: pName,
        qr_code: makeQrCode(name, pName, i + 1)
      }));
      const res = await api('POST', 'patrol_points', pointRows);
      if (!res) throw new Error('Failed to save patrol points');

      toast(`✓ ${name} saved with ${points.length} patrol point${points.length > 1 ? 's' : ''}`, 'success');

      document.getElementById('inp-loc-name').value = '';
      document.getElementById('inp-loc-address').value = '';
      document.getElementById('points-list').innerHTML = '';
      pointCount = 0; addPointRow();

      await loadLocations();
      openLocation(loc.id);
    } catch(e) {
      console.error('Save error:', e);
      toast(e.message || 'Failed to save', 'error');
    }

    btn.innerHTML = 'Save Location & Generate QR Codes'; btn.disabled = false;
  }

  async function loadLocations() {
    try {
      const locs = await api('GET', 'locations?order=created_at.desc&select=*');
      const el = document.getElementById('loc-list');
      
      // Fallback structural check to prevent layout crashes if the data returns invalid structure
      if (!locs || !Array.isArray(locs)) {
        el.innerHTML = '<div style="text-align:center;padding:30px;color:#f87171;font-size:13px;">Error loading locations. Check API keys.</div>';
        return;
      }
      
      if (locs.length === 0) {
        el.innerHTML = '<div style="text-align:center;padding:30px;color:#bbb;font-size:13px;">No locations yet. Add one above.</div>';
        return;
      }
      
      el.innerHTML = locs.map(l => `
        <div class="loc-item ${l.id === selectedLocId ? 'selected' : ''} ${!l.is_active ? 'inactive' : ''}" onclick="openLocation('${l.id}')">
          <div class="loc-item-top">
            <span class="loc-name">${l.name || 'Active Base'}</span>
            <span class="active-dot ${l.is_active ? 'on' : 'off'}"></span>
          </div>
          <div class="loc-meta">${l.total_points || 0} patrol point${l.total_points !== 1 ? 's' : ''} · ${l.address || 'No address registered'}</div>
          <div class="loc-actions">
            <button class="btn btn-ghost" onclick="event.stopPropagation();toggleActive('${l.id}',${l.is_active})">${l.is_active ? 'Deactivate' : 'Activate'}</button>
            <button class="btn btn-danger" onclick="event.stopPropagation();deleteLocation('${l.id}','${(l.name || 'Active Base').replace(/'/g, "\\'")}')">Delete</button>
          </div>
        </div>`).join('');
    } catch (err) {
      console.error('Render crash:', err);
      document.getElementById('loc-list').innerHTML = '<div style="text-align:center;padding:30px;color:#f87171;font-size:13px;">Critical error parsing response array.</div>';
    }
  }

  async function openLocation(locId) {
    selectedLocId = locId;
    document.querySelectorAll('.loc-item').forEach(el => {
      el.classList.toggle('selected', el.getAttribute('onclick') && el.getAttribute('onclick').includes(locId));
    });

    const right = document.getElementById('right-panel');
    right.innerHTML = '<div style="padding:60px;text-align:center;color:#bbb"><div style="width:28px;height:28px;border:3px solid #e0e7ff;border-top-color:#1E90FF;border-radius:50%;animation:spinning 0.8s linear infinite;margin:0 auto 12px;"></div>Loading QR Codes...</div>';

    const [locs, points] = await Promise.all([
      api('GET', `locations?id=eq.${locId}&select=*`),
      api('GET', `patrol_points?location_id=eq.${locId}&order=created_at.asc&select=*`)
    ]);

    if (!locs || !Array.isArray(locs) || locs.length === 0) { right.innerHTML = '<div class="empty-right"><p>Location not found.</p></div>'; return; }
    const loc = locs[0];
    const validPoints = Array.isArray(points) ? points : [];

    right.innerHTML = `
      <div class="loc-detail-header">
        <div>
          <h2>${loc.name || 'Active Base'}</h2>
          ${loc.address ? `<div class="address">${loc.address}</div>` : ''}
        </div>
        <div class="detail-actions">
          <button class="btn btn-ghost" onclick="window.print()">🖨 Print QR Codes</button>
        </div>
      </div>
      <div class="download-bar">
        <span>${validPoints.length} QR Code${validPoints.length !== 1 ? 's' : ''} for this location</span>
        <div class="download-bar-btns">
          <button class="btn-download" onclick="downloadAllQR('${(loc.name || 'Base').replace(/'/g, "\\'")}')">⬇ Download All</button>
          <button class="btn-ghost" style="width:auto;padding:7px 14px;font-size:11px;" onclick="window.print()">🖨 Print</button>
        </div>
      </div>
      <div class="section-label">QR Codes — ${validPoints.length} Patrol Point${validPoints.length !== 1 ? 's' : ''}</div>
      <div class="qr-grid" id="qr-grid-screen"></div>
      <div class="print-cards" id="qr-grid-print"></div>`;

    validPoints.forEach((pt, i) => {
      const scanUrl = `${SCAN_BASE}?qr=${encodeURIComponent(pt.qr_code)}`;

      const screenCard = document.createElement('div');
      screenCard.className = 'qr-card-screen';
      const wrapId = `qr-s-${i}`;
      screenCard.innerHTML = `
        <div class="qr-canvas-wrap"><div id="${wrapId}"></div></div>
        <div class="qr-point-name">${pt.point_name}</div>
        <div class="qr-code-id">${pt.qr_code}</div>
        <button class="btn-download" style="margin-top:8px;font-size:10px;padding:5px 10px;" onclick="downloadSingleQR('${wrapId}','${pt.point_name.replace(/'/g, "\\'")}')">⬇ Download</button>`;
      document.getElementById('qr-grid-screen').appendChild(screenCard);
      setTimeout(() => {
        new QRCode(document.getElementById(wrapId), {
          text: scanUrl, width: 140, height: 140,
          colorDark: '#062B63', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H
        });
      }, 60 * i);

      const printCard = document.createElement('div');
      printCard.className = 'print-card';
      const printId = `qr-p-${i}`;
      printCard.innerHTML = `
        <div class="print-card-header"><div class="print-mini-logo">JG</div><div class="print-brand">JIVAC GROUP</div></div>
        <div id="${printId}" style="display:inline-block;margin-bottom:8px;"></div>
        <div class="print-point">${pt.point_name}</div>
        <div class="print-loc">${loc.name || 'Active Base'}</div>
        <div class="print-code">${pt.qr_code}</div>
        <div class="print-instr">Scan to record patrol</div>`;
      document.getElementById('qr-grid-print').appendChild(printCard);
      setTimeout(() => {
        new QRCode(document.getElementById(printId), {
          text: scanUrl, width: 160, height: 160,
          colorDark: '#062B63', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.H
        });
      }, 60 * i);
    });
  }

  function downloadSingleQR(wrapId, pointName) {
    setTimeout(() => {
      const wrap = document.getElementById(wrapId);
      const canvas = wrap ? wrap.querySelector('canvas') : null;
      if (!canvas) { toast('QR not ready yet, try again in a second', 'error'); return; }
      const link = document.createElement('a');
      link.download = `QR-${pointName.replace(/\s+/g,'-')}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }, 200);
  }

  function downloadAllQR(locName) {
    const canvases = document.querySelectorAll('#qr-grid-screen canvas');
    const names    = document.querySelectorAll('.qr-point-name');
    if (canvases.length === 0) { toast('QR codes not ready yet', 'error'); return; }
    canvases.forEach((canvas, i) => {
      setTimeout(() => {
        const link = document.createElement('a');
        const name = names[i] ? names[i].textContent : `Point-${i+1}`;
        link.download = `QR-${locName.replace(/\s+/g,'-')}-${name.replace(/\s+/g,'-')}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }, i * 400);
    });
    toast(`Downloading ${canvases.length} QR code${canvases.length > 1 ? 's' : ''}...`);
  }

  async function toggleActive(locId, current) {
    const res = await api('PATCH', `locations?id=eq.${locId}`, { is_active: !current });
    if (!res) { toast('Failed to update', 'error'); return; }
    toast(current ? 'Location deactivated' : 'Location activated');
    await loadLocations();
    if (selectedLocId === locId) openLocation(locId);
  }

  async function deleteLocation(locId, name) {
    if (!confirm(`Delete "${name}" and all its QR codes? This cannot be undone.`)) return;
    await api('DELETE', `patrol_points?location_id=eq.${locId}`);
    await api('DELETE', `locations?id=eq.${locId}`);
    toast(`"${name}" deleted`);
    if (selectedLocId === locId) {
      selectedLocId = null;
      document.getElementById('right-panel').innerHTML = `<div class="empty-right"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ddd" stroke-width="1.5"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="3" height="3"/></svg><p>Select a location to view its QR codes</p></div>`;
    }
    await loadLocations();
  }

  addPointRow();
  loadLocations();
</script>
</body>
</html>
